name: Release

# Push a tag vX.Y.Z to build and publish a release. Use workflow_dispatch with
# no tag for a build-only dry run (artifacts only, nothing published). Pass an
# existing tag vX.Y.Z to build that tag and publish a release for it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag vX.Y.Z to release. Leave empty for a build-only dry run."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build portable ZIP and installer
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Resolve version and check Cargo.toml
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          $cargoToml = Get-Content -Raw -Path Cargo.toml
          $cargoMatch = [regex]::Match($cargoToml, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) {
            throw "Could not find the package version in Cargo.toml"
          }
          $cargoVersion = $cargoMatch.Groups[1].Value

          $tag = ''
          if ($env:EVENT_NAME -eq 'push') {
            $tag = $env:PUSH_TAG
          } elseif ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:INPUT_TAG
          }

          if ([string]::IsNullOrEmpty($tag)) {
            # Dry run: no tag, so nothing is published. Names come from Cargo.toml.
            $version = $cargoVersion
            $release = 'false'
            $tagOut = ''
          } else {
            $tagMatch = [regex]::Match($tag, '^v(\d+\.\d+\.\d+)$')
            if (-not $tagMatch.Success) {
              throw "Tag '$tag' must look like vX.Y.Z"
            }
            $version = $tagMatch.Groups[1].Value
            if ($cargoVersion -ne $version) {
              throw "Cargo.toml version '$cargoVersion' does not match tag version '$version'"
            }
            $release = 'true'
            $tagOut = $tag
          }

          # Write outputs without a BOM so GITHUB_OUTPUT parses correctly.
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`nrelease=$release`ntag=$tagOut`n")
          Write-Host "Building version $version (publish: $release)"

      - name: Install stable MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable-x86_64-pc-windows-msvc
          rustup show
          $hostLine = (rustc -vV | Select-String -Pattern '^host:').Line
          if ($hostLine -notmatch 'x86_64-pc-windows-msvc') {
            throw "Expected the MSVC host toolchain, got: $hostLine"
          }

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      # Output is target\release\opencrosshair.exe (no --target flag, so the path stays fixed).
      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) {
              throw "choco install innosetup failed with exit code $LASTEXITCODE"
            }
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe was not found at $iscc after installing Inno Setup"
          }
          Write-Host "Inno Setup found at $iscc"

      - name: Build portable ZIP
        shell: pwsh
        run: ./installer/build-portable.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path dist -File |
            Where-Object { $_.Name -like '*-setup.exe' -or $_.Name -like '*-portable-win64.zip' } |
            Sort-Object Name)
          if ($files.Count -ne 2) {
            throw "Expected 2 release files in dist, found $($files.Count)"
          }
          $lines = foreach ($f in $files) {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 -LiteralPath $f.FullName).Hash.ToLowerInvariant(), $f.Name
          }
          $sumsPath = Join-Path $PWD 'dist/SHA256SUMS'
          [System.IO.File]::WriteAllText($sumsPath, (($lines -join "`n") + "`n"))
          Get-Content -LiteralPath $sumsPath

      - name: Upload release files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/OpenCrosshair-${{ steps.version.outputs.version }}-setup.exe
            dist/OpenCrosshair-${{ steps.version.outputs.version }}-portable-win64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    needs: build
    # Only tag pushes and dispatches with a tag publish. Dry runs stop after the build.
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files

      - name: Create GitHub release with files
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: release-files/*
          fail_on_unmatched_files: true
          generate_release_notes: true
